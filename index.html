<!DOCTYPE html>
<html lang="pt_br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E foi assim... gerador de aventuras</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <h1 class="hidden">E foi assim...<br />gerador de aventuras</h1>
  <main id="startscreem" class="">
    <div id="buttonContainer">
      <button type="button" id="newfich">Nova Ficha</button>
      <button type="button" id="loadfich">Carregar Ficha</button>
      <button type="button" id="findfich">Pesquisar Ficha</button>
    </div>
    <input type="file" id="fileInput" accept=".json" class="hidden" />
  </main>
  <fieldset id="setupfich" class="hidden">
    <img class="titleimg" src="./assets/imgs/titulo.png" alt="Titulo - E foi assim..." />
    <form id="datafich">
      <div class="form-group-h">
        <div class="optionsradio">
          <input type="radio" id="avcurto" class="dataunic" name="scale" value="short" required />
          <label for="avcurto">Aventura Curta</label>
        </div>
        <div class="optionsradio">
          <input type="radio" id="avlongo" class="dataunic" name="scale" value="long" required />
          <label for="avlongo">Aventura Longa</label>
        </div>
      </div>
      <h3>Nome da aventura</h3>
      <input type="text" id="adventureName" class="dataunic" name="title"
        placeholder="Faça referencia ao pesquisador ou à descoberta da aventura." required />
      <h3>Pesquisador</h3>
      <input type="text" id="cientistName" class="dataunic" name="scientist"
        placeholder="Nome do pesquisador central da aventura." required />
      <h3>Objetivo - Descoberta/Invenção</h3>
      <input type="text" id="discoveryName" class="dataunic" name="objective"
        placeholder="Remete à descoberta ou invenção a ser induzida ao pesquisador." required />
      <h3>Detalhamento</h3>
      <textarea id="detailedDescription" class="dataunic" name="detailing"
        placeholder="Descreva detalhes que achar relevantes à aventura, seus objetivos e desafios." required></textarea>
      <h3>Marcos principais</h3>
      <div class="form-group-v">
        <div class="marcoBox">
          <div class="arrowbuttons">
            <button class="upArrow" type="button">&#9650;</button>
            <label class="numberOrder">1º</label>
            <button class="downArrow" type="button">&#9660;</button>
          </div>
          <div class="marcoInputBox">
            <input type="text" class="marcoInput" name="eventsmain" required />
          </div>
          <div class="deleteButtonContainer">
            <button type="button" class="functionButton deleteButton">-</button>
          </div>
        </div>
        <div class="marcoBox">
          <div class="arrowbuttons">
            <button class="upArrow" type="button">&#9650;</button>
            <label class="numberOrder">2º</label>
            <button class="downArrow" type="button">&#9660;</button>
          </div>
          <div class="marcoInputBox">
            <input type="text" class="marcoInput" name="eventsmain" required />
          </div>
          <div class="deleteButtonContainer">
            <button type="button" class="functionButton deleteButton">-</button>
          </div>
        </div>
      </div>
      <div class="functionButtonContainer">
        <button type="button" id="addMarcoP" class="functionButton">+</button>
      </div>
      <h3>Marcos extras</h3>
      <div class="form-group-v">
        <div class="marcoExBox">
          <div class="marcoExInputBox">
            <input type="text" class="marcoExInput" name="eventsextra" required />
          </div>
          <div class="deleteButtonContainer">
            <button type="button" class="functionButton deleteButton">-</button>
          </div>
        </div>
        <div class="marcoExBox">
          <div class="marcoExInputBox">
            <input type="text" class="marcoExInput" name="eventsextra" required />
          </div>
          <div class="deleteButtonContainer">
            <button type="button" class="functionButton deleteButton">-</button>
          </div>
        </div>
      </div>
      <div class="functionButtonContainer">
        <button type="button" id="addMarcoE" class="functionButton">+</button>
      </div>
      <h3>Autor</h3>
      <input type="text" id="authorName" class="dataunic" name="author"
        placeholder="Seu nome, ou como gostária de ser reconhecido." required />
      <button type="button" id="savebutton">Salvar (JSON)</button>
      <button id="exportbutton">Exportar (SVG)</button>
      <button id="viewbutton">Visualizar (HTML)</button>
      <button type="button" id="backbutton" class="backButton">Voltar (Inicio)</button>
    </form>
  </fieldset>
  <fieldset id="loaderfich" class="hidden">
    <img class="titleimg" src="./assets/imgs/titulo.png" alt="Titulo - E foi assim..." />
  </fieldset>
  <fieldset id="searchfich" class="hidden">
    <img class="titleimg" src="./assets/imgs/titulo.png" alt="Titulo - E foi assim..." />
  </fieldset>
  <div id="adventureOutput"></div>

  <script src="script.js"></script>

</body>

</html>
