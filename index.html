<!DOCTYPE html>
<html lang="pt_br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E foi assim... gerador de aventuras</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <h1 class="hidden">E foi assim...<br />gerador de aventuras</h1>
  <main id="startscreem" class="">
    <div id="buttonContainer">
      <button id="newfich">Nova Ficha</button>
      <button id="loadfich">Carregar Ficha</button>
      <button id="findfich">Pesquisar Ficha</button>
    </div>
  </main>
  <fieldset id="setupfich" class="hidden">
    <img class="titleimg" src="./assets/imgs/titulo.png" alt="Titulo - E foi assim..." />
    <form id="datafich">
      <div class="form-group-h">
        <div class="optionsradio">
          <input type="radio" id="avcurto" name="typegame" value="curto" />
          <label for="avcurto">Aventura Curta</label>
        </div>
        <div class="optionsradio">
          <input type="radio" id="avlongo" name="typegame" value="longo" />
          <label for="avlongo">Aventura Longa</label>
        </div>
      </div>
      <h3>Nome da aventura</h3>
      <input type="text" id="adventureName" name="adventureName"
        placeholder="Faça referencia ao pesquisador ou à descoberta da aventura." />
      <h3>Pesquisador</h3>
      <input type="text" id="cientistName" name="cientistName" placeholder="Nome do pesquisador central da aventura." />
      <h3>Descoberta/Invenção</h3>
      <input type="text" id="discoveryName" name="discoveryName"
        placeholder="Nome da descoberta ou invenção central da aventura." />
      <h3>Autor</h3>
      <input type="text" id="authorName" name="authorName"
        placeholder="Seu nome, ou como gostária de ser reconhecido." />
      <h3>Marcos principais</h3>
      <div class="form-group-v">
        <div class="marcoBox">
          <div class="arrowbuttons">
            <button class="upArrow" type="button">&#9650;</button>
            <label class="numberOrder">1</label>
            <button class="downArrow" type="button">&#9660;</button>
          </div>
          <div class="marcoInputBox">
            <input type="text" class="marcoInput" name="marcoP" />
          </div>
          <div class="deleteButtonContainer">
            <button class="functionButton deleteButton">-</button>
          </div>
        </div>
        <div class="marcoBox">
          <div class="arrowbuttons">
            <button class="upArrow" type="button">&#9650;</button>
            <label class="numberOrder">2</label>
            <button class="downArrow" type="button">&#9660;</button>
          </div>
          <div class="marcoInputBox">
            <input type="text" class="marcoInput" name="marcoP" />
          </div>
          <div class="deleteButtonContainer">
            <button class="functionButton deleteButton">-</button>
          </div>
        </div>
      </div>
      <div class="functionButtonContainer">
        <button id="addMarcoP" class="functionButton">+</button>
      </div>
      <h3>Marcos extras</h3>
      <div class="form-group-v">
      </div>
      <div class="functionButtonContainer">
        <button id="addMarcoE" class="functionButton">+</button>
      </div>
      <button class="backbutton">Voltar</button>
    </form>
  </fieldset>
  <fieldset id="loaderfich" class="hidden">
    <img class="titleimg" src="./assets/imgs/titulo.png" alt="Titulo - E foi assim..." />
  </fieldset>
  <fieldset id="searchfich" class="hidden">
    <img class="titleimg" src="./assets/imgs/titulo.png" alt="Titulo - E foi assim..." />
  </fieldset>
  <div id="adventureOutput"></div>

  <script src="script.js"></script>

</body>

</html>
